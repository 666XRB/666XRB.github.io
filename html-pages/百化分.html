<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>半点五百分数 · 速记训练</title>
<style>
  :root{
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#eef3f9;
    background-image:radial-gradient(900px 480px at 50% -180px,#dbeafe,transparent 70%);
    color:var(--ink);
    min-height:100vh;
    padding:26px 16px 64px;
  }
  .app{max-width:980px;margin:0 auto}

  header{text-align:center;margin-bottom:20px}
  h1{
    font-size:26px;margin:0 0 8px;letter-spacing:.5px;
    background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:0;color:var(--muted);font-size:13.5px}

  /* ---------- 控制面板 ---------- */
  .panel{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    background:#fff;border-radius:16px;padding:13px 16px;
    box-shadow:0 1px 2px rgba(15,23,42,.06),0 10px 26px -18px rgba(15,23,42,.5);
    margin-bottom:18px;
  }
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font:inherit;font-size:14px;font-weight:600;
    border:1px solid var(--line);background:#fff;color:#334155;
    padding:9px 15px;border-radius:10px;cursor:pointer;
    transition:transform .12s,background .12s,box-shadow .12s;
  }
  button:hover{background:#f8fafc}
  button:active{transform:scale(.97)}
  button.primary{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:#fff;border-color:transparent;
    box-shadow:0 8px 18px -8px rgba(37,99,235,.85);
  }
  button.primary:hover{background:linear-gradient(135deg,#1d4ed8,#2563eb)}

  .stats{display:flex;gap:20px;padding-right:4px}
  .stat{display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .stat span{font-size:10.5px;color:var(--muted);letter-spacing:1px}
  .stat b{font-size:18px;font-variant-numeric:tabular-nums}

  /* ---------- 题目网格 ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
    gap:12px;
  }
  .cell{
    background:#fff;border-radius:14px;
    padding:12px 14px 7px;
    border-left:4px solid var(--c,#cbd5e1);
    box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 20px -18px rgba(15,23,42,.9);
    transition:background .15s,box-shadow .15s;
  }
  .row{display:flex;align-items:center;gap:8px}

  .frac{
    display:inline-flex;flex-direction:column;align-items:stretch;
    font-size:14px;font-weight:800;line-height:1.14;
    color:#334155;text-align:center;flex:0 0 auto;
  }
  .frac .num{border-bottom:1.6px solid currentColor;padding-bottom:1px}

  .eq{font-weight:700;color:#94a3b8;font-size:14px}

  .a{
    flex:1;min-width:0;display:flex;align-items:baseline;gap:1px;
    border-bottom:2px solid #cbd5e1;transition:border-color .15s;
  }
  .a:focus-within{border-color:#2563eb}
  .a input{
    flex:1;min-width:0;border:none;outline:none;background:transparent;
    font:inherit;font-size:17px;font-weight:800;color:#1d4ed8;
    text-align:right;padding:2px 0;
    font-variant-numeric:tabular-nums;
  }
  .pct{font-size:14px;font-weight:800;color:#94a3b8}

  .fb{
    min-height:16px;margin-top:4px;
    font-size:11.5px;font-weight:600;color:transparent;
  }

  /* 状态 */
  .cell.ok{background:#f0fdf4}
  .cell.ok .a{border-color:#22c55e}
  .cell.ok input{color:#16a34a}
  .cell.ok .fb{color:#16a34a}

  .cell.bad{background:#fef2f2}
  .cell.bad .a{border-color:#ef4444}
  .cell.bad input{color:#dc2626}
  .cell.bad .fb{color:#dc2626}

  .cell.hint{background:#fffbeb}
  .cell.hint .a{border-color:#fbbf24}
  .cell.hint .fb{color:#d97706}

  footer.tip{
    margin-top:26px;padding:14px 18px;border-radius:14px;
    background:#fff;border:1px dashed #cbd5e1;
    color:#475569;font-size:13px;line-height:1.8;
  }
  footer.tip b{color:#1d4ed8}
  code{
    background:#eff6ff;color:#1d4ed8;padding:1px 6px;border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>半点五 · 百分数速记</h1>
    <p class="sub">1/3.5 ～ 1/19.5 — 练到条件反射，考场上不再现场推导</p>
  </header>

  <div class="panel">
    <div class="tools">
      <button class="primary" id="checkBtn">检查答案</button>
      <button id="retryBtn">重来</button>
      <button id="shuffleBtn">打乱顺序</button>
      <button id="showBtn">显示答案</button>
    </div>
    <div class="stats">
      <div class="stat"><span>正确</span><b id="statOk">—</b></div>
      <div class="stat"><span>错误</span><b id="statBad">—</b></div>
      <div class="stat"><span>用时</span><b id="statTime">0.0s</b></div>
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <footer class="tip">
    <b>小规律：</b>1/x.5 其实就是 <code>2/(2x+1)</code>，比如 <code>1/12.5 = 2/25 = 8%</code>、<code>1/13.5 = 2/27 ≈ 7.4%</code>。<br>
    <b>快速记忆链：</b>12.5→8% ｜ 13.5→7.4% ｜ 14.5→6.9% ｜ 15.5→6.5% ｜ 16.5→6.1% ｜ 17.5→5.7% ｜ 18.5→5.4% ｜ 19.5→5.1%<br>
    <b>别忘了互推：</b>1/12.5=8% ⟺ 8/100=12.5%，正着背完，倒着再默一遍。
  </footer>

</div>

<script>
(function () {
  /* ============ 题库 ============ */
  const DATA = [
    { d: '3.5',  a: 28.6 },
    { d: '4.5',  a: 22.2 },
    { d: '5.5',  a: 18.2 },
    { d: '6.5',  a: 15.4 },
    { d: '7.5',  a: 13.3 },
    { d: '8.5',  a: 11.8 },
    { d: '9.5',  a: 10.5 },
    { d: '10.5', a: 9.5  },
    { d: '11.5', a: 8.7  },
    { d: '12.5', a: 8    },
    { d: '13.5', a: 7.4  },
    { d: '14.5', a: 6.9  },
    { d: '15.5', a: 6.5  },
    { d: '16.5', a: 6.1, alt: [6] },
    { d: '17.5', a: 5.7  },
    { d: '18.5', a: 5.4  },
    { d: '19.5', a: 5.1  }
  ];

  const grid     = document.getElementById('grid');
  const statOk   = document.getElementById('statOk');
  const statBad  = document.getElementById('statBad');
  const statTime = document.getElementById('statTime');

  let order = DATA.map((_, i) => i);
  let startTime = null, timerId = null;

  /* ============ 工具 ============ */
  const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);

  function groupColor(d) {
    const n = parseFloat(d);
    if (n <= 5.5)  return '#3b82f6';
    if (n <= 8.5)  return '#eab308';
    if (n <= 11.5) return '#22c55e';
    if (n <= 14.5) return '#f97316';
    if (n <= 17.5) return '#a855f7';
    return '#ec4899';
  }

  function isCorrect(item, v) {
    const near = (x, y) => Math.abs(x - y) < 0.051;
    if (near(v, item.a)) return true;
    if (item.alt && item.alt.some(x => near(v, x))) return true;
    return false;
  }

  /* ============ 计时 ============ */
  function startTimer() {
    if (startTime) return;
    startTime = Date.now();
    timerId = setInterval(() => {
      statTime.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    }, 100);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    if (startTime) {
      statTime.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    }
  }
  function resetTimer() {
    stopTimer();
    startTime = null;
    statTime.textContent = '0.0s';
  }

  /* ============ 渲染 ============ */
  function build() {
    grid.innerHTML = '';
    order.forEach(i => {
      const it = DATA[i];
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.i = i;
      cell.style.setProperty('--c', groupColor(it.d));
      cell.innerHTML =
        '<div class="row">' +
          '<span class="frac"><span class="num">1</span><span class="den">' + it.d + '</span></span>' +
          '<span class="eq">=</span>' +
          '<span class="a"><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false"><span class="pct">%</span></span>' +
        '</div>' +
        '<div class="fb"></div>';
      grid.appendChild(cell);
    });

    grid.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', onInput);
      inp.addEventListener('keydown', onKey);
    });
  }

  function onInput(e) {
    startTimer();
    const cell = e.target.closest('.cell');
    cell.classList.remove('ok', 'bad', 'hint');
    const fb = cell.querySelector('.fb');
    fb.className = 'fb';
    fb.textContent = '';
  }

  function onKey(e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const inputs = Array.from(grid.querySelectorAll('input'));
    const k = inputs.indexOf(e.target);
    if (k < inputs.length - 1) {
      inputs[k + 1].focus();
      inputs[k + 1].select();
    } else {
      e.target.blur();
      check();
    }
  }

  /* ============ 检查 ============ */
  function check() {
    stopTimer();
    let ok = 0, bad = 0;

    grid.querySelectorAll('.cell').forEach(cell => {
      const it  = DATA[+cell.dataset.i];
      const inp = cell.querySelector('input');
      const fb  = cell.querySelector('.fb');
      const raw = inp.value.trim();

      cell.classList.remove('ok', 'bad', 'hint');

      if (raw === '') {
        cell.classList.add('hint');
        fb.className = 'fb';
        fb.textContent = '正确答案 ' + fmt(it.a) + '%';
        return;
      }

      const v = parseFloat(raw);
      if (!isNaN(v) && isCorrect(it, v)) {
        ok++;
        cell.classList.add('ok');
        fb.className = 'fb';
        fb.textContent = '✓ 正确';
      } else {
        bad++;
        cell.classList.add('bad');
        fb.className = 'fb';
        fb.textContent = '✗ 应为 ' + fmt(it.a) + '%';
      }
    });

    statOk.textContent  = ok;
    statBad.textContent = bad;

    if (ok === DATA.length) {
      statOk.textContent = ok + ' 🎉';
    }
  }

  /* ============ 重来 / 打乱 / 显示答案 ============ */
  function retry(keepFocus) {
    resetTimer();
    statOk.textContent  = '—';
    statBad.textContent = '—';
    grid.querySelectorAll('.cell').forEach(cell => {
      cell.classList.remove('ok', 'bad', 'hint');
      const inp = cell.querySelector('input');
      inp.value = '';
      const fb = cell.querySelector('.fb');
      fb.className = 'fb';
      fb.textContent = '';
    });
    if (keepFocus !== false) {
      const first = grid.querySelector('input');
      if (first) first.focus();
    }
  }

  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    build();
    retry(false);
  }

  function showAll() {
    stopTimer();
    grid.querySelectorAll('.cell').forEach(cell => {
      const it  = DATA[+cell.dataset.i];
      const inp = cell.querySelector('input');
      const fb  = cell.querySelector('.fb');
      inp.value = fmt(it.a);
      cell.classList.remove('ok', 'bad');
      cell.classList.add('hint');
      fb.className = 'fb';
      fb.textContent = '记住它 ↑';
    });
  }

  /* ============ 绑定 ============ */
  document.getElementById('checkBtn').addEventListener('click', check);
  document.getElementById('retryBtn').addEventListener('click', () => retry(true));
  document.getElementById('shuffleBtn').addEventListener('click', shuffle);
  document.getElementById('showBtn').addEventListener('click', showAll);

  build();
})();
</script>
</body>
</html>
