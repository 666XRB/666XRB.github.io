<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>容斥极值 - 极致交互版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 900px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        .stage {
            position: relative;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* 核心交互样式：鼠标悬浮时的动画 */
        .bar-group {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* 默认状态 */
        .male-bar { fill: url(#blueGrad); stroke: #3b82f6; stroke-width: 2; }
        .age-bar { fill: url(#redGrad); stroke: #ef4444; stroke-width: 2; }
        .overlap-bar { fill: url(#overlapGrad); stroke: #8b5cf6; stroke-width: 2; }

        /* 当悬浮在男性条形上 */
        .hover-male .male-bar { opacity: 1; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.8)); transform: scale(1.02) translateY(-2px); }
        .hover-male .age-bar { opacity: 0.2; }
        .hover-male .overlap-bar { opacity: 0.2; }

        /* 当悬浮在年龄条形上 */
        .hover-age .age-bar { opacity: 1; filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.8)); transform: scale(1.02) translateY(-2px); }
        .hover-age .male-bar { opacity: 0.2; }
        .hover-age .overlap-bar { opacity: 0.2; }

        /* 当悬浮在重叠区上 */
        .hover-overlap .overlap-bar { opacity: 1; filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.9)); transform: scale(1.05) translateY(-3px); }
        .hover-overlap .male-bar { opacity: 0.3; }
        .hover-overlap .age-bar { opacity: 0.3; }

        /* 文字样式 */
        .label {
            font-size: 16px;
            font-weight: bold;
            fill: #fff;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .overlap-label {
            font-size: 18px;
            font-weight: bold;
            fill: #fff;
            pointer-events: none;
            opacity: 0; /* 初始隐藏 */
            transition: opacity 0.3s;
        }

        .hover-overlap .overlap-label { opacity: 1; }
        
        /* 提示框 */
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -10px);
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 10;
            white-space: nowrap;
        }
        
        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.95) transparent transparent;
        }

        .tooltip.show {
            opacity: 1;
            transform: translate(-50%, -20px);
        }

        .highlight { color: #a78bfa; font-weight: bold; }

        /* 底部控制区 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        
        .btn-secondary:hover { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>最不利构造 (容斥极值) 动态解析</h1>
        <p>鼠标悬停在不同色块上，查看高亮与数据提示</p>
    </div>

    <div class="stage" id="stage">
        <!-- 提示框 -->
        <div class="tooltip" id="tooltip"></div>

        <svg viewBox="0 0 1000 300" id="svgCanvas">
            <defs>
                <!-- 渐变定义 -->
                <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#3b82f6" />
                    <stop offset="100%" stop-color="#60a5fa" />
                </linearGradient>
                <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ef4444" />
                    <stop offset="100%" stop-color="#f87171" />
                </linearGradient>
                <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="100%" stop-color="#c084fc" />
                </linearGradient>
            </defs>

            <!-- 100% 虚线框 -->
            <rect x="0" y="80" width="1000" height="120" rx="15" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6" />
            <text x="500" y="60" text-anchor="middle" font-size="16" fill="#94a3b8" font-weight="bold">全体用户总盘子 = 100%</text>

            <!-- 1. 蓝条组 (男性 55.87%) -->
            <!-- 宽度：1000 * 0.5587 = 558.7 -->
            <g class="bar-group" id="maleGroup" onmouseenter="showHover('male', event)" onmousemove="moveTooltip(event)" onmouseleave="hideHover()">
                <rect x="0" y="80" width="558.7" height="120" rx="60" class="male-bar" />
                <!-- 文字定位在不重叠的左侧 -->
                <text x="180" y="148" text-anchor="middle" class="label">男性 55.87%</text>
            </g>

            <!-- 2. 红条组 (19-45岁 67.15%) -->
            <!-- 宽度：1000 * 0.6715 = 671.5 -->
            <!-- 初始位置靠左，点击动画后移动到右侧 -->
            <g class="bar-group" id="ageGroup" onmouseenter="showHover('age', event)" onmousemove="moveTooltip(event)" onmouseleave="hideHover()">
                <rect x="0" y="80" width="671.5" height="120" rx="60" class="age-bar" id="ageRect" />
                <!-- 文字定位在不重叠的右侧 -->
                <text x="820" y="148" text-anchor="middle" class="label" id="ageLabel">19-45岁 67.15%</text>
            </g>

            <!-- 3. 重叠区组 (19-45岁男性) -->
            <!-- 仅在极致错开时出现（宽度 1000 * 0.2302 = 230.2） -->
            <!-- 位置：男性右边界(558.7) - 重叠宽度(230.2) = 328.5 -->
            <g class="bar-group" id="overlapGroup" style="opacity: 0; pointer-events: none;" onmouseenter="showHover('overlap', event)" onmousemove="moveTooltip(event)" onmouseleave="hideHover()">
                <rect x="328.5" y="80" width="230.2" height="120" rx="60" class="overlap-bar" />
                <text x="443.6" y="148" text-anchor="middle" class="overlap-label">交集</text>
            </g>
        </svg>
    </div>

    <div class="controls">
        <button class="btn-primary" id="animateBtn" onclick="spreadOut()">✨ 极致错开 (最不利情况)</button>
        <button class="btn-secondary" onclick="reset()">🔄 重置</button>
    </div>
</div>

<script>
    const ageRect = document.getElementById('ageRect');
    const ageLabel = document.getElementById('ageLabel');
    const overlapGroup = document.getElementById('overlapGroup');
    const stage = document.getElementById('stage');
    const tooltip = document.getElementById('tooltip');
    const animateBtn = document.getElementById('animateBtn');

    // 初始状态：红蓝条重合（为了看清楚，稍微给红条留一点偏移）
    let isSpread = false;

    // 核心动画函数
    function spreadOut() {
        if (isSpread) return;
        isSpread = true;

        // 红条向右滑动到最右边界
        // 目标 x = 1000 - 671.5 = 328.5
        ageRect.setAttribute('x', '328.5');
        ageRect.style.transition = 'x 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)'; // 优雅的回弹效果

        // 红条文字跟着移动
        ageLabel.setAttribute('x', '820');
        ageLabel.style.transition = 'x 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // 显示重叠区（等红条滑动到一半时再出现，视觉更好）
        setTimeout(() => {
            overlapGroup.style.opacity = '1';
            overlapGroup.style.pointerEvents = 'auto'; // 允许鼠标交互
            tooltip.innerHTML = '看！无论怎么错开，中间必然有 <span class="highlight">23.02%</span> 的重叠';
            tooltip.classList.add('show');
            tooltip.style.left = '50%';
            tooltip.style.top = '30%';
            
            // 3秒后隐藏提示
            setTimeout(() => tooltip.classList.remove('show'), 3000);
        }, 800);
        
        animateBtn.style.display = 'none';
    }

    function reset() {
        isSpread = false;
        ageRect.setAttribute('x', '0');
        ageRect.style.transition = 'x 0.8s ease';
        ageLabel.setAttribute('x', '820');
        ageLabel.style.transition = 'x 0.8s ease';
        
        overlapGroup.style.opacity = '0';
        overlapGroup.style.pointerEvents = 'none';
        hideHover();
        animateBtn.style.display = 'block';
    }

    // ---------------- 交互逻辑核心 ----------------

    function showHover(type, event) {
        // 清除所有悬浮状态
        stage.className = 'stage'; 
        
        if (type === 'male') {
            stage.classList.add('hover-male');
            tooltip.innerHTML = '👨 <b>男性群体</b><br>占总用户比例：<span class="highlight">55.87%</span>';
        } else if (type === 'age') {
            stage.classList.add('hover-age');
            tooltip.innerHTML = '👦 <b>19-45岁群体</b><br>占总用户比例：<span class="highlight">67.15%</span>';
        } else if (type === 'overlap') {
            stage.classList.add('hover-overlap');
            // 这里的公式是资料分析常考的核心
            tooltip.innerHTML = '🔥 <b>必定重叠区域 (19-45岁男性)</b><br>男性(55.87%) + 年龄(67.15%) - 总盘(100%)<br>= <span class="highlight">23.02%</span>';
        }
        
        tooltip.classList.add('show');
        moveTooltip(event);
    }

    function moveTooltip(event) {
        // 让提示框跟随鼠标
        const rect = stage.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
    }

    function hideHover() {
        stage.className = 'stage';
        tooltip.classList.remove('show');
    }
</script>

</body>
</html>
